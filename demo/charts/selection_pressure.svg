<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
<rect width="1000" height="520" fill="#fcfcfb"/>
<text x="60" y="38" font-size="21" fill="#0b0b0b" text-anchor="start" font-weight="600">Давление отбора: во сколько раз лучшая особь выбирается чаще случайного</text><text x="60" y="60" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">50 процессов, популяция M = 60, pᵢ ~ U[1, p_max]; среднее по 5 независимым популяциям на точку</text><line x1="60" y1="84" x2="78" y2="84" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><text x="86" y="88" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">пропорциональный, fitness = 1/(1+F)</text><line x1="349.5" y1="84" x2="367.5" y2="84" stroke="#eb6834" stroke-width="2" stroke-linecap="round"/><text x="375.5" y="88" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">пропорциональный со сдвигом F_max − F</text><line x1="652.8" y1="84" x2="670.8" y2="84" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/><text x="678.8" y="88" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">ранговый отбор (s = 2)</text><line x1="68" y1="389" x2="700" y2="389" stroke="#e1e0d9" stroke-width="1" /><text x="58" y="393" font-size="12" fill="#898781" text-anchor="end" font-weight="400">1×</text><line x1="68" y1="311" x2="700" y2="311" stroke="#e1e0d9" stroke-width="1" /><text x="58" y="315" font-size="12" fill="#898781" text-anchor="end" font-weight="400">2×</text><line x1="68" y1="233" x2="700" y2="233" stroke="#e1e0d9" stroke-width="1" /><text x="58" y="237" font-size="12" fill="#898781" text-anchor="end" font-weight="400">3×</text><line x1="68" y1="155" x2="700" y2="155" stroke="#e1e0d9" stroke-width="1" /><text x="58" y="159" font-size="12" fill="#898781" text-anchor="end" font-weight="400">4×</text><line x1="68" y1="428" x2="68" y2="433" stroke="#c3c2b7" stroke-width="1" /><text x="68" y="448" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10</text><line x1="278.7" y1="428" x2="278.7" y2="433" stroke="#c3c2b7" stroke-width="1" /><text x="278.7" y="448" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">100</text><line x1="489.3" y1="428" x2="489.3" y2="433" stroke="#c3c2b7" stroke-width="1" /><text x="489.3" y="448" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">1000</text><line x1="700" y1="428" x2="700" y2="433" stroke="#c3c2b7" stroke-width="1" /><text x="700" y="448" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10000</text><line x1="68" y1="428" x2="700" y2="428" stroke="#c3c2b7" stroke-width="1" /><text x="384" y="468" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">p_max — верхняя граница pᵢ (логарифмическая шкала)</text><line x1="68" y1="389" x2="700" y2="389" stroke="#898781" stroke-width="1" stroke-dasharray="4 4"/><text x="74" y="405" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">случайный выбор (1×)</text><path d="M68,384.3 L168.5,385.8 L278.7,387.1 L379.2,387.8 L489.3,388.4 L589.8,388.7 L700,388.8" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M68,316.8 L168.5,300.3 L278.7,284 L379.2,280.4 L489.3,205.2 L589.8,224.3 L700,156.1" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M68,311 L168.5,311 L278.7,311 L379.2,311 L489.3,311 L589.8,311 L700,311" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="68" cy="384.3" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="168.5" cy="385.8" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="278.7" cy="387.1" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="379.2" cy="387.8" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="489.3" cy="388.4" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="589.8" cy="388.7" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="700" cy=